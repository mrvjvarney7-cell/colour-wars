<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colour Wars</title>
<link rel="stylesheet" href="style.css?v=38">
</head>
<body>

  <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Switch to light theme">Light mode</button>

  <section id="setup-screen" class="screen">
    <div class="setup-card">
      <h1 class="title">Colour Wars</h1>
      <p class="subtitle">Pass-and-play chain reaction strategy</p>

      <div class="field">
        <div class="field-label">Players</div>
        <div id="player-count-buttons" class="segmented"></div>
      </div>

      <div class="field">
        <div class="field-label">Colours &amp; opponents</div>
        <div id="player-list" class="player-list"></div>
        <label class="ai-insight-toggle hidden" id="ai-insight-toggle">
          <input type="checkbox" id="ai-insight-toggle-input" checked>
          Show AI's win chance &amp; considered moves
        </label>
      </div>

      <button id="start-game-btn" class="primary-btn">Start Game</button>
      <p class="build-tag">build 38</p>
    </div>
  </section>

  <section id="game-screen" class="screen hidden">
    <div class="game-layout">
      <div class="game-main">
        <header class="turn-bar" id="turn-bar">
          <div class="turn-indicator" id="turn-indicator">
            <span class="turn-dot" id="turn-dot"></span>
            <span id="turn-label">Player 1's turn</span>
            <span id="ai-thinking" class="ai-thinking hidden">
              <span class="ai-thinking-dot"></span>
              <span class="ai-thinking-dot"></span>
              <span class="ai-thinking-dot"></span>
              AI is thinking&hellip;
            </span>
            <span id="ai-insight" class="ai-insight hidden"></span>
          </div>
          <button id="new-game-btn" class="icon-btn" aria-label="New game">New Game</button>
        </header>

        <div class="players-strip" id="players-strip"></div>
        <div class="stats-panel" id="stats-panel"></div>

        <div class="board-wrap">
          <div class="board" id="board"></div>
          <div class="fx-layer" id="fx-layer"></div>
        </div>
      </div>

      <aside class="move-history-panel" id="move-history-panel">
        <div class="move-history-header">Moves</div>
        <div class="move-history-list" id="move-history-list"></div>
      </aside>
    </div>
  </section>

  <section id="win-screen" class="screen hidden overlay">
    <div class="win-card">
      <div class="win-dot" id="win-dot"></div>
      <h2 id="win-title">Player 1 wins!</h2>
      <button id="play-again-btn" class="primary-btn">New Game</button>
    </div>
  </section>

  <script src="js/gameLogic.js?v=38"></script>
  <script src="js/ai/encode.js?v=38"></script>
  <script src="js/ai/network.js?v=38"></script>
  <script src="js/ai/mcts.js?v=38"></script>
  <script src="js/ai/weights.js?v=38"></script>
  <script src="js/ui.js?v=38"></script>

  <!-- TEST-ONLY automation harness, appended for this run - not part of the
       shipped page. Drives the real, unmodified UI above via real DOM
       events, then writes a JSON summary into document.title for the
       headless-Edge --dump-dom capture to read back. -->
  <script>
    (function () {
      'use strict';
      var errors = [];
      window.onerror = function (msg, src, line, col, err) {
        errors.push(String(msg) + ' @' + line + ':' + col);
        return false;
      };

      function report(obj) {
        document.title = 'RESULT:' + JSON.stringify(obj);
      }

      function fail(reason) {
        report({ ok: false, reason: reason, errors: errors });
      }

      try {
        if (typeof GameLogic === 'undefined') return fail('GameLogic did not load');
        if (typeof Encode === 'undefined') return fail('Encode did not load');
        if (typeof NeuralNet === 'undefined') return fail('NeuralNet did not load');
        if (typeof MCTS === 'undefined') return fail('MCTS did not load');
        if (typeof AI_WEIGHTS === 'undefined') return fail('AI_WEIGHTS did not load');

        // Toggle player 2 (seat 1) to AI, leaving player 1 (seat 0) human -
        // exercises the per-seat AI toggle exactly as a real player would use it.
        var rowsBefore = document.querySelectorAll('#player-list .player-row');
        if (rowsBefore.length !== 2) return fail('expected 2 player rows by default, got ' + rowsBefore.length);
        var seat1ToggleBefore = rowsBefore[1].querySelector('.ai-toggle-btn');
        if (!seat1ToggleBefore) return fail('AI toggle button not found on player 2 row');
        seat1ToggleBefore.click();
        // renderPlayerList() rebuilds the row DOM on click, so re-query rather
        // than reuse the now-detached original reference.
        var seat1ToggleAfter = document.querySelectorAll('#player-list .player-row')[1].querySelector('.ai-toggle-btn');
        if (!seat1ToggleAfter || !seat1ToggleAfter.classList.contains('active')) {
          return fail('player 2 AI toggle did not become active after click');
        }

        // The version picker's option list is populated from an async fetch
        // (js/ai/versions/index.json) - see browser_ai_version_select_test.html
        // for full coverage of that. Here we only need the default AI
        // (window.AI_VERSION, loaded eagerly with the page - no fetch
        // involved) to already be in effect, which it is synchronously.
        if (typeof AI_VERSION === 'undefined' || AI_VERSION.iteration == null) {
          return fail('AI_VERSION not loaded');
        }

        document.getElementById('start-game-btn').click();

        // Version info is shown per-seat now (each AI opponent can be a
        // different checkpoint - see browser_ai_version_select_test.html for
        // full per-seat picker coverage) - seat 1's chip should carry the
        // default AI_VERSION's iteration, since its picker was never touched.
        var seat1Chip = document.querySelectorAll('.player-chip')[1];
        var seat1VersionLabel = seat1Chip ? seat1Chip.querySelector('.player-chip-ai-version') : null;
        if (!seat1VersionLabel || seat1VersionLabel.textContent !== 'iter ' + AI_VERSION.iteration) {
          return fail('player 2 chip AI version label missing/wrong: "' +
            (seat1VersionLabel ? seat1VersionLabel.textContent : null) + '"');
        }
        if (document.getElementById('setup-screen').classList.contains('hidden') === false) {
          return fail('setup screen did not hide after Start Game');
        }
        if (document.getElementById('game-screen').classList.contains('hidden')) {
          return fail('game screen did not show after Start Game');
        }

        var cellsBefore = document.querySelectorAll('.cell').length;
        if (cellsBefore !== 49) return fail('expected 49 cells, got ' + cellsBefore);

        // Before any move, every cell is a legal opening target - all 49
        // should be highlighted.
        var legalBeforeOpening = document.querySelectorAll('.cell.legal-move').length;
        if (legalBeforeOpening !== 49) {
          return fail('expected all 49 cells highlighted as legal before opening, got ' + legalBeforeOpening);
        }

        // Human (seat 0) opens in the center - always legal on an empty board.
        var centerCell = document.querySelector('.cell[data-row="3"][data-col="3"]');
        if (!centerCell) return fail('center cell not found');
        centerCell.click();

        var thinkingWasShown = false;
        var insightWasShown = false;
        var insightTextSeen = '';
        var insightBadgeCountSeen = 0;
        var pollCount = 0;
        var maxPolls = 400; // 400 * 150ms = 60s ceiling

        var poll = setInterval(function () {
          pollCount++;
          var thinkingEl = document.getElementById('ai-thinking');
          if (!thinkingEl.classList.contains('hidden')) thinkingWasShown = true;

          var insightEl = document.getElementById('ai-insight');
          if (!insightEl.classList.contains('hidden')) {
            insightWasShown = true;
            insightTextSeen = insightEl.textContent;
            insightBadgeCountSeen = document.querySelectorAll('.ai-candidate-badge').length;
          }

          var ownedCells = document.querySelectorAll('.cell.owned').length;
          var stillThinking = !thinkingEl.classList.contains('hidden');

          if (!stillThinking && ownedCells >= 2) {
            clearInterval(poll);
            finish(ownedCells);
          } else if (pollCount >= maxPolls) {
            clearInterval(poll);
            fail('timed out waiting for AI move (ownedCells=' + ownedCells +
                 ', thinkingWasShown=' + thinkingWasShown + ')');
          }
        }, 150);

        function finish(ownedCells) {
          try {
            var insightCheck = { ok: true };
            if (!insightWasShown) {
              insightCheck = { ok: false, reason: 'ai-insight was never shown' };
            } else if (!/^AI: \d+% chance$/.test(insightTextSeen)) {
              insightCheck = { ok: false, reason: 'unexpected insight text: "' + insightTextSeen + '"' };
            } else if (insightBadgeCountSeen < 1) {
              insightCheck = { ok: false, reason: 'expected at least 1 candidate-move badge, saw ' + insightBadgeCountSeen };
            }
            // Badges must be cleared again once the move actually lands.
            var badgesAfter = document.querySelectorAll('.ai-candidate-badge').length;
            if (badgesAfter !== 0) {
              insightCheck = { ok: false, reason: 'expected candidate badges cleared after the move, found ' + badgesAfter };
            }
            // Re-derive board state straight from the DOM to confirm both
            // moves actually landed with plausible owner/count, independent
            // of ui.js's own internal state.
            var owned = document.querySelectorAll('.cell.owned');
            var summary = [];
            owned.forEach(function (el) {
              var cluster = el.querySelector('.dot-cluster');
              summary.push({
                row: el.dataset.row, col: el.dataset.col,
                count: cluster.getAttribute('data-count')
              });
            });

            // Back to the human's turn, and they've already opened - only
            // their own cell (3,3) should be highlighted as legal now, and
            // clicking anywhere else should shake, not silently do nothing.
            var ownCell = document.querySelector('.cell[data-row="3"][data-col="3"]');
            var ownCellLegalCheck = { ok: true };
            if (!ownCell.classList.contains('legal-move')) {
              ownCellLegalCheck = { ok: false, reason: 'own cell (3,3) should be legal-move after opening' };
            }
            var allCells = document.querySelectorAll('.cell');
            var emptyUnownedCell = null;
            for (var i = 0; i < allCells.length; i++) {
              if (!allCells[i].classList.contains('owned')) { emptyUnownedCell = allCells[i]; break; }
            }
            var illegalCellCheck = { ok: true };
            if (!emptyUnownedCell) {
              illegalCellCheck = { ok: false, reason: 'no empty cell found to test' };
            } else if (emptyUnownedCell.classList.contains('legal-move')) {
              illegalCellCheck = { ok: false, reason: 'unowned empty cell should not be legal-move' };
            } else {
              emptyUnownedCell.click();
              var shook = emptyUnownedCell.classList.contains('shake');
              var ownedUnchanged = document.querySelectorAll('.cell.owned').length === ownedCells;
              if (!shook || !ownedUnchanged) {
                illegalCellCheck = { ok: false, reason: 'illegal click should shake and not change board', shook: shook, ownedUnchanged: ownedUnchanged };
              }
            }

            // Stats panel check: both players have opened with exactly 3 dots
            // on exactly 1 cell each at this point, on a 7x7 (49-cell) board
            // with critical mass 4 (so 3 dots/cell max capacity, 147 total) -
            // percentages are of the WHOLE board, not a share between
            // players, so each should read "1 sq (2%)" / "3 dots (2%)"
            // (1/49 and 3/147 both round to 2%).
            var statRows = document.querySelectorAll('#stats-panel .stat-row');
            var statsCheck = { ok: true };
            if (statRows.length !== 2) {
              statsCheck = { ok: false, reason: 'expected 2 stat rows, got ' + statRows.length };
            } else {
              statRows.forEach(function (row, idx) {
                var values = row.querySelectorAll('.stat-value');
                var squaresText = values[0].textContent;
                var dotsText = values[1].textContent;
                if (squaresText.indexOf('1') === -1 || squaresText.indexOf('2%') === -1 ||
                    dotsText.indexOf('3') === -1 || dotsText.indexOf('2%') === -1) {
                  statsCheck = {
                    ok: false,
                    reason: 'row ' + idx + ' stats look wrong: "' + squaresText + '" / "' + dotsText + '"'
                  };
                }
              });
            }

            // Coordinate labels: files a-g along the bottom row, ranks 1-7
            // up the left column, both in the cell's top-left corner - the
            // bottom-left cell carries both ("a1"), a mid-board cell neither.
            var coordCheck = { ok: true };
            var bottomLeft = document.querySelector('.cell[data-row="6"][data-col="0"] .cell-coord');
            var bottomRight = document.querySelector('.cell[data-row="6"][data-col="6"] .cell-coord');
            var topLeft = document.querySelector('.cell[data-row="0"][data-col="0"] .cell-coord');
            var midCellCoord = document.querySelector('.cell[data-row="3"][data-col="3"] .cell-coord');
            if (!bottomLeft || bottomLeft.textContent !== 'a1') {
              coordCheck = { ok: false, reason: 'bottom-left cell should read "a1", got ' + (bottomLeft && bottomLeft.textContent) };
            } else if (!bottomRight || bottomRight.textContent !== 'g') {
              coordCheck = { ok: false, reason: 'bottom-right cell should read "g", got ' + (bottomRight && bottomRight.textContent) };
            } else if (!topLeft || topLeft.textContent !== '7') {
              coordCheck = { ok: false, reason: 'top-left cell should read "7", got ' + (topLeft && topLeft.textContent) };
            } else if (midCellCoord) {
              coordCheck = { ok: false, reason: 'mid-board cell should have no coordinate label' };
            }

            // Move history: a 2p game puts both opening moves in round 1 -
            // one cell per seat, human's move first, in algebraic notation.
            var moveCells = document.querySelectorAll('#move-history-list .move-cell:not(.empty)');
            var moveHistoryCheck = { ok: true };
            var plyLabel = document.querySelector('#move-history-list .move-ply');
            if (moveCells.length !== 2) {
              moveHistoryCheck = { ok: false, reason: 'expected 2 move cells, got ' + moveCells.length };
            } else if (!plyLabel || plyLabel.textContent !== '1.') {
              moveHistoryCheck = { ok: false, reason: 'expected a single round labelled "1."' };
            } else {
              var firstNotation = moveCells[0].textContent;
              var secondNotation = moveCells[1].textContent;
              if (firstNotation !== 'd4') {
                moveHistoryCheck = { ok: false, reason: 'expected first move "d4" (human opened at 3,3), got "' + firstNotation + '"' };
              } else if (!/^[a-g][1-7]$/.test(secondNotation)) {
                moveHistoryCheck = { ok: false, reason: 'second move notation looks wrong: "' + secondNotation + '"' };
              } else if (!moveCells[1].classList.contains('viewing')) {
                moveHistoryCheck = { ok: false, reason: 'the live move should be marked viewing while not browsing history' };
              }
            }

            // Arrow-key history browsing: stepping back should show only the
            // human's opening move, disable clicking, and say so in the turn
            // label; stepping forward again should restore the live view.
            var historyCheck = { ok: true };
            document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowLeft' }));
            var ownedWhileBrowsing = document.querySelectorAll('.cell.owned').length;
            var turnLabelWhileBrowsing = document.getElementById('turn-label').textContent;
            if (ownedWhileBrowsing !== 1) {
              historyCheck = { ok: false, reason: 'stepping back one move should show 1 owned cell, saw ' + ownedWhileBrowsing };
            } else if (turnLabelWhileBrowsing.indexOf('Viewing move') !== 0) {
              historyCheck = { ok: false, reason: 'turn label should say "Viewing move..." while browsing, got "' + turnLabelWhileBrowsing + '"' };
            } else {
              // A click while browsing must not apply to the (invisible) live board.
              document.querySelector('.cell[data-row="3"][data-col="3"]').click();
              if (document.querySelectorAll('.cell.owned').length !== 1) {
                historyCheck = { ok: false, reason: 'click while browsing history should be a no-op' };
              } else {
                document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowRight' }));
                var ownedBackLive = document.querySelectorAll('.cell.owned').length;
                var legalAfterReturn = document.querySelectorAll('.cell.legal-move').length;
                if (ownedBackLive !== ownedCells) {
                  historyCheck = { ok: false, reason: 'returning to live should restore ' + ownedCells + ' owned cells, saw ' + ownedBackLive };
                } else if (legalAfterReturn < 1) {
                  historyCheck = { ok: false, reason: 'returning to live should restore legal-move highlighting' };
                }
              }
            }

            // Note: AI move timing is NOT measured here - this page runs
            // under --virtual-time-budget, which freezes performance.now()
            // during synchronous execution (it only advances virtual time
            // for pending timers/idle gaps). See run_ai_move_timing.py /
            // ai_move_timing_test.html for a real wall-clock measurement.
            report({
              ok: errors.length === 0 && ownCellLegalCheck.ok && illegalCellCheck.ok && statsCheck.ok &&
                  insightCheck.ok && coordCheck.ok && moveHistoryCheck.ok && historyCheck.ok,
              errors: errors,
              thinkingWasShown: thinkingWasShown,
              ownedCellCount: ownedCells,
              cells: summary,
              turnLabel: document.getElementById('turn-label').textContent,
              ownCellLegalCheck: ownCellLegalCheck,
              illegalCellCheck: illegalCellCheck,
              statsCheck: statsCheck,
              insightCheck: insightCheck,
              coordCheck: coordCheck,
              moveHistoryCheck: moveHistoryCheck,
              historyCheck: historyCheck,
              insightTextSeen: insightTextSeen,
              insightBadgeCountSeen: insightBadgeCountSeen
            });
          } catch (e) {
            fail('exception in finish(): ' + e.message);
          }
        }
      } catch (e) {
        fail('exception in test driver: ' + e.message);
      }
    })();
  </script>
</body>
</html>
