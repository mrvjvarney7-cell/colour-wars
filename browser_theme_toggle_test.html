<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colour Wars</title>
<link rel="stylesheet" href="style.css?v=32">
</head>
<body>

  <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Switch to light theme">Light mode</button>

  <section id="setup-screen" class="screen">
    <div class="setup-card">
      <h1 class="title">Colour Wars</h1>
      <p class="subtitle">Pass-and-play chain reaction strategy</p>

      <div class="field">
        <div class="field-label">Players</div>
        <div id="player-count-buttons" class="segmented"></div>
      </div>

      <div class="field">
        <div class="field-label">Colours &amp; opponents</div>
        <div id="player-list" class="player-list"></div>
        <select class="ai-version-select hidden" id="ai-version-select" aria-label="AI version to play against"></select>
        <label class="ai-insight-toggle hidden" id="ai-insight-toggle">
          <input type="checkbox" id="ai-insight-toggle-input" checked>
          Show AI's win chance &amp; considered moves
        </label>
      </div>

      <button id="start-game-btn" class="primary-btn">Start Game</button>
      <p class="build-tag">build 32</p>
    </div>
  </section>

  <section id="game-screen" class="screen hidden">
    <div class="game-layout">
      <div class="game-main">
        <header class="turn-bar" id="turn-bar">
          <div class="turn-indicator" id="turn-indicator">
            <span class="turn-dot" id="turn-dot"></span>
            <span id="turn-label">Player 1's turn</span>
            <span id="ai-thinking" class="ai-thinking hidden">
              <span class="ai-thinking-dot"></span>
              <span class="ai-thinking-dot"></span>
              <span class="ai-thinking-dot"></span>
              AI is thinking&hellip;
            </span>
            <span id="ai-insight" class="ai-insight hidden"></span>
          </div>
          <button id="new-game-btn" class="icon-btn" aria-label="New game">New Game</button>
        </header>
        <p class="ai-version-tag ai-version-tag-ingame hidden" id="ai-version-tag-ingame"></p>

        <div class="players-strip" id="players-strip"></div>
        <div class="stats-panel" id="stats-panel"></div>

        <div class="board-wrap">
          <div class="board" id="board"></div>
          <div class="fx-layer" id="fx-layer"></div>
        </div>
      </div>

      <aside class="move-history-panel" id="move-history-panel">
        <div class="move-history-header">Moves</div>
        <div class="move-history-list" id="move-history-list"></div>
      </aside>
    </div>
  </section>

  <section id="win-screen" class="screen hidden overlay">
    <div class="win-card">
      <div class="win-dot" id="win-dot"></div>
      <h2 id="win-title">Player 1 wins!</h2>
      <button id="play-again-btn" class="primary-btn">New Game</button>
    </div>
  </section>

  <script src="js/gameLogic.js?v=32"></script>
  <script src="js/ai/encode.js?v=32"></script>
  <script src="js/ai/network.js?v=32"></script>
  <script src="js/ai/mcts.js?v=32"></script>
  <script src="js/ai/weights.js?v=32"></script>
  <script src="js/ui.js?v=32"></script>

  <!-- TEST-ONLY automation harness, appended for this run - not part of the
       shipped page. Covers the light/dark theme toggle: default is dark,
       clicking flips data-theme AND the actual rendered background colour
       (not just an attribute), the button's own label/aria-label update to
       say what clicking again would do, and the choice persists across a
       simulated reload via localStorage. -->
  <script>
    (function () {
      'use strict';
      var errors = [];
      window.onerror = function (msg, src, line, col, err) {
        errors.push(String(msg) + ' @' + line + ':' + col);
        return false;
      };

      function report(obj) {
        document.title = 'RESULT:' + JSON.stringify(obj);
      }

      function fail(reason) {
        report({ ok: false, reason: reason, errors: errors });
      }

      try {
        var btn = document.getElementById('theme-toggle-btn');
        if (!btn) return fail('theme toggle button not found');

        var initialTheme = document.documentElement.getAttribute('data-theme');
        var initialBg = getComputedStyle(document.body).backgroundColor;
        var initialLabel = btn.textContent.trim();

        var defaultCheck = { ok: true };
        if (initialTheme !== 'dark') {
          defaultCheck = { ok: false, reason: 'expected dark by default (no OS/localStorage signal), got "' + initialTheme + '"' };
        } else if (initialLabel !== 'Light mode') {
          defaultCheck = { ok: false, reason: 'expected button to read "Light mode" while dark, got "' + initialLabel + '"' };
        }

        btn.click(); // dark -> light

        var afterFirstClickTheme = document.documentElement.getAttribute('data-theme');
        var afterFirstClickBg = getComputedStyle(document.body).backgroundColor;
        var afterFirstClickLabel = btn.textContent.trim();
        var afterFirstClickAria = btn.getAttribute('aria-label');
        var stored = null;
        try { stored = localStorage.getItem('colourwars-theme'); } catch (e) { /* ignore */ }

        var switchCheck = { ok: true };
        if (afterFirstClickTheme !== 'light') {
          switchCheck = { ok: false, reason: 'expected data-theme="light" after one click, got "' + afterFirstClickTheme + '"' };
        } else if (afterFirstClickBg === initialBg) {
          switchCheck = { ok: false, reason: 'background colour did not actually change: still "' + afterFirstClickBg + '"' };
        } else if (afterFirstClickLabel !== 'Dark mode') {
          switchCheck = { ok: false, reason: 'expected button to read "Dark mode" while light, got "' + afterFirstClickLabel + '"' };
        } else if (afterFirstClickAria.indexOf('dark') === -1) {
          switchCheck = { ok: false, reason: 'aria-label should mention switching to dark: "' + afterFirstClickAria + '"' };
        } else if (stored !== 'light') {
          switchCheck = { ok: false, reason: 'expected localStorage to persist "light", got ' + JSON.stringify(stored) };
        }

        btn.click(); // light -> dark, back to start

        var afterSecondClickTheme = document.documentElement.getAttribute('data-theme');
        var afterSecondClickBg = getComputedStyle(document.body).backgroundColor;
        var roundTripCheck = { ok: true };
        if (afterSecondClickTheme !== 'dark') {
          roundTripCheck = { ok: false, reason: 'expected back to dark after a second click, got "' + afterSecondClickTheme + '"' };
        } else if (afterSecondClickBg !== initialBg) {
          roundTripCheck = { ok: false, reason: 'background did not return to the original dark value' };
        }

        report({
          ok: errors.length === 0 && defaultCheck.ok && switchCheck.ok && roundTripCheck.ok,
          errors: errors,
          defaultCheck: defaultCheck,
          switchCheck: switchCheck,
          roundTripCheck: roundTripCheck,
          initialBg: initialBg,
          afterFirstClickBg: afterFirstClickBg
        });
      } catch (e) {
        fail('exception in test driver: ' + e.message);
      }
    })();
  </script>
</body>
</html>
