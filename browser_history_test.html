<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- GitHub Pages sends Cache-Control: max-age=600 on this file, and it has
     no cache-buster of its own (unlike style.css/js, which carry ?v=N) -
     browsers, especially mobile ones, can hold a stale copy well past a
     manual refresh. This asks the browser itself not to cache the page. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Colour Wars</title>
<!-- ?v= is a cache buster: GitHub Pages serves these with Cache-Control: max-age=600,
     and mobile browsers often keep serving a cached copy even after a manual
     refresh. Bump the number whenever style.css or the js/ files change. -->
<link rel="stylesheet" href="style.css?v=46">
</head>
<body>

  <!-- Fixed outside the screens below so it stays reachable no matter which
       one (setup/game/win) is currently showing. -->
  <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Switch to light theme">Light mode</button>

  <!-- Setup screen -->
  <section id="setup-screen" class="screen">
    <div class="setup-card">
      <h1 class="title">Colour Wars</h1>
      <p class="subtitle">Pass-and-play chain reaction strategy</p>

      <div class="field">
        <div class="field-label">Players</div>
        <div id="player-count-buttons" class="segmented"></div>
      </div>

      <div class="field">
        <div class="field-label">Colours &amp; opponents</div>
        <div id="player-list" class="player-list"></div>
        <label class="ai-insight-toggle hidden" id="ai-insight-toggle">
          <input type="checkbox" id="ai-insight-toggle-input" checked>
          Show AI's win chance &amp; considered moves
        </label>
      </div>

      <div class="field">
        <div class="field-label">Analysis</div>
        <!-- Not gated behind any AI seat being in play - a neutral analysis
             engine (the default bundled network), same idea as a chess
             site's eval bar not caring which bot you're actually playing. -->
        <label class="ai-insight-toggle" id="policy-heatmap-toggle">
          <input type="checkbox" id="policy-heatmap-toggle-input">
          Show policy heatmap
        </label>
      </div>

      <button id="start-game-btn" class="primary-btn">Start Game</button>
      <button id="open-history-btn" class="secondary-btn" type="button">Game History</button>
      <!-- Lets us confirm which build a device is actually running, since mobile
           browsers cache aggressively. Bump alongside the ?v= cache buster. -->
      <p class="build-tag">ColourWarsBeta1.0</p>
    </div>
  </section>

  <!-- Local game history (T7) - past games stored in localStorage, nothing
       leaves the device. -->
  <section id="history-screen" class="screen hidden">
    <div class="setup-card">
      <h1 class="title">Game History</h1>
      <div class="field">
        <div class="field-label">Stats</div>
        <div class="stats-panel" id="history-stats-panel"></div>
      </div>
      <div class="field">
        <div class="field-label">Past games</div>
        <div class="history-list" id="history-list"></div>
      </div>
      <button id="clear-history-btn" class="secondary-btn" type="button">Clear History</button>
      <button id="back-from-history-btn" class="primary-btn" type="button">Back</button>
    </div>
  </section>

  <!-- Game screen -->
  <section id="game-screen" class="screen hidden">
    <div class="game-layout">
      <div class="game-main">
        <header class="turn-bar" id="turn-bar">
          <div class="turn-indicator" id="turn-indicator">
            <span class="turn-dot" id="turn-dot"></span>
            <span id="turn-label">Player 1's turn</span>
            <span id="ai-thinking" class="ai-thinking hidden">
              <span class="ai-thinking-dot"></span>
              <span class="ai-thinking-dot"></span>
              <span class="ai-thinking-dot"></span>
              AI is thinking&hellip;
            </span>
            <span id="ai-insight" class="ai-insight hidden"></span>
          </div>
          <button id="share-btn" class="icon-btn" aria-label="Copy a link to this position" title="Share this position">Share</button>
          <button id="new-game-btn" class="icon-btn" aria-label="New game">New Game</button>
        </header>

        <div class="players-strip" id="players-strip"></div>
        <div class="stats-panel" id="stats-panel"></div>

        <div class="board-row">
          <!-- Value head's win probability for the side to move, no search -
               a neutral analysis engine (window.AI_WEIGHTS), same as the
               policy heatmap above, not tied to any AI opponent's own
               checkpoint. Hidden whenever there's nothing to show it for
               (no game, game over, browsing move history). -->
          <div class="eval-bar hidden" id="eval-bar" aria-hidden="true">
            <span class="eval-bar-label" id="eval-bar-label"></span>
            <div class="eval-bar-track">
              <div class="eval-bar-fill" id="eval-bar-fill"></div>
            </div>
          </div>
          <div class="board-wrap">
            <div class="board" id="board"></div>
            <div class="fx-layer" id="fx-layer"></div>
          </div>
        </div>
      </div>

      <aside class="move-history-panel" id="move-history-panel">
        <div class="move-history-header">
          <span>Moves</span>
          <span class="move-history-actions">
            <button id="export-game-btn" class="text-btn" type="button" aria-label="Export this game">Export</button>
            <button id="import-game-btn" class="text-btn" type="button" aria-label="Import a game">Import</button>
          </span>
        </div>
        <div class="move-history-list" id="move-history-list"></div>
      </aside>
    </div>
  </section>

  <!-- Win overlay -->
  <section id="win-screen" class="screen hidden overlay">
    <div class="win-card">
      <div class="win-dot" id="win-dot"></div>
      <h2 id="win-title">Player 1 wins!</h2>
      <button id="play-again-btn" class="primary-btn">New Game</button>
    </div>
  </section>

  <script src="js/gameLogic.js?v=46"></script>
  <script src="js/ai/encode.js?v=46"></script>
  <script src="js/ai/network.js?v=46"></script>
  <script src="js/ai/mcts.js?v=46"></script>
  <script src="js/ai/weights.js?v=46"></script>
  <script src="js/ui.js?v=46"></script>

  <!-- TEST-ONLY automation harness, appended for this run - not part of the
       shipped page. Covers T7 (local history): a game that finishes for
       real gets recorded to localStorage with the right summary fields, the
       history screen's stats reflect it, and clicking the row replays the
       exact same game via T6's replay path. The page is loaded with a
       hand-crafted ?cwn= position one explosion away from eliminating
       player 2, so a real game-over is reached with a single click instead
       of playing out a full game move by move. -->
  <script>
    (function () {
      'use strict';
      var errors = [];
      window.onerror = function (msg, src, line, col, err) {
        errors.push(String(msg) + ' @' + line + ':' + col);
        return false;
      };

      function report(obj) { document.title = 'RESULT:' + JSON.stringify(obj); }
      function fail(reason) { report({ ok: false, reason: reason, errors: errors }); }

      function afterTick(fn) { setTimeout(fn, 100); }

      try {
        if (typeof GameLogic === 'undefined') return fail('GameLogic did not load');

        localStorage.removeItem('colourwars-history');

        // Loaded via ?cwn= (see index.html query string below) - board has
        // player 0 at (0,1) with 3 dots (one placement from exploding) and
        // player 1 with exactly one cell, (0,0), 1 dot. Exploding (0,1)
        // captures (0,0), eliminating player 1 - a real, complete game.
        if (document.getElementById('game-screen').classList.contains('hidden')) {
          return fail('expected the ?cwn= link to load straight into the game screen');
        }

        var targetCell = document.querySelector('.cell[data-row="0"][data-col="1"]');
        if (targetCell) targetCell.click();

        // The single explosion wave still needs to animate (FLIGHT_MS 220 +
        // WAVE_PAUSE_MS 90, plus a little slack) before commitMove's .then()
        // actually updates state/records the finished game.
        setTimeout(function () {
          var winVisible = !document.getElementById('win-screen').classList.contains('hidden');
          var stored = JSON.parse(localStorage.getItem('colourwars-history') || '[]');
          var recordCheck = { ok: true };
          if (!winVisible) {
            recordCheck = { ok: false, reason: 'expected the win screen after eliminating player 2' };
          } else if (stored.length !== 1) {
            recordCheck = { ok: false, reason: 'expected exactly 1 stored history entry, got ' + stored.length };
          } else {
            var entry = stored[0];
            if (entry.winnerIndex !== 0) recordCheck = { ok: false, reason: 'expected player 0 (index 0) to be recorded as winner, got ' + entry.winnerIndex };
            else if (entry.numPlayers !== 2) recordCheck = { ok: false, reason: 'expected numPlayers 2, got ' + entry.numPlayers };
            else if (entry.moves.length !== 1 || entry.moves[0] !== 'b7') recordCheck = { ok: false, reason: 'expected a single recorded move "b7", got ' + JSON.stringify(entry.moves) };
            else if (typeof entry.startCwn !== 'string') recordCheck = { ok: false, reason: 'expected a startCwn string for replay' };
          }

          document.getElementById('play-again-btn').click(); // win screen's "New Game" -> back to setup
          afterTick(function () {
            document.getElementById('open-history-btn').click();
            afterTick(function () {
              var rows = document.querySelectorAll('.history-row');
              var statsText = document.getElementById('history-stats-panel').textContent;
              var screenCheck = { ok: true };
              if (rows.length !== 1) {
                screenCheck = { ok: false, reason: 'expected 1 history row, got ' + rows.length };
              } else if (statsText.indexOf('Games played: 1') === -1) {
                screenCheck = { ok: false, reason: 'stats panel missing "Games played: 1": ' + statsText };
              } else if (statsText.indexOf('longest chain 1') !== -1 === false && rows[0].textContent.indexOf('longest chain 1') === -1) {
                screenCheck = { ok: false, reason: 'history row missing "longest chain 1": ' + rows[0].textContent };
              }

              if (rows.length !== 1) {
                return report({ ok: false, errors: errors, recordCheck: recordCheck, screenCheck: screenCheck });
              }

              rows[0].click(); // replay
              afterTick(function () {
                // Replaying a finished game shows the final board directly
                // (game-screen), not the win overlay again - lets you
                // review a completed game rather than re-triggering a
                // celebratory popup. The eliminated player's chip is how a
                // replay actually shows the outcome.
                var gameScreenVisible = !document.getElementById('game-screen').classList.contains('hidden');
                var eliminatedChip = document.querySelector('.player-chip.eliminated');
                var replayCheck = { ok: true };
                if (!gameScreenVisible) {
                  replayCheck = { ok: false, reason: 'expected the replayed game to show the game screen (final board), not stay hidden' };
                } else if (!eliminatedChip) {
                  replayCheck = { ok: false, reason: 'expected player 2 to show as eliminated in the replayed game' };
                }

                report({
                  ok: errors.length === 0 && recordCheck.ok && screenCheck.ok && replayCheck.ok,
                  errors: errors,
                  recordCheck: recordCheck,
                  screenCheck: screenCheck,
                  replayCheck: replayCheck
                });
              });
            });
          });
        }, 600);
      } catch (e) {
        fail('exception in test driver: ' + e.message);
      }
    })();
  </script>
</body>
</html>
