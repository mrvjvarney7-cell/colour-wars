<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Colour Wars</title>
<link rel="stylesheet" href="style.css?v=47">
</head>
<body>

  <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" aria-label="Switch to light theme">Light mode</button>

  <section id="setup-screen" class="screen">
    <div class="setup-card">
      <h1 class="title">Colour Wars</h1>
      <p class="subtitle">Pass-and-play chain reaction strategy</p>

      <div class="field">
        <div class="field-label">Players</div>
        <div id="player-count-buttons" class="segmented"></div>
      </div>

      <div class="field">
        <div class="field-label">Colours &amp; opponents</div>
        <div id="player-list" class="player-list"></div>
        <label class="ai-insight-toggle hidden" id="ai-insight-toggle">
          <input type="checkbox" id="ai-insight-toggle-input" checked>
          Show AI's win chance &amp; considered moves
        </label>
      </div>

      <button id="start-game-btn" class="primary-btn">Start Game</button>
      <p class="build-tag">ColourWarsBeta1.0</p>
    </div>
  </section>

  <section id="game-screen" class="screen hidden">
    <div class="game-layout">
      <div class="game-main">
        <header class="turn-bar" id="turn-bar">
          <div class="turn-indicator" id="turn-indicator">
            <span class="turn-dot" id="turn-dot"></span>
            <span id="turn-label">Player 1's turn</span>
            <span id="ai-thinking" class="ai-thinking hidden">
              <span class="ai-thinking-dot"></span>
              <span class="ai-thinking-dot"></span>
              <span class="ai-thinking-dot"></span>
              AI is thinking&hellip;
            </span>
            <span id="ai-insight" class="ai-insight hidden"></span>
          </div>
          <button id="new-game-btn" class="icon-btn" aria-label="New game">New Game</button>
        </header>

        <div class="players-strip" id="players-strip"></div>
        <div class="stats-panel" id="stats-panel"></div>

        <div class="board-wrap">
          <div class="board" id="board"></div>
          <div class="fx-layer" id="fx-layer"></div>
        </div>
      </div>

      <aside class="move-history-panel" id="move-history-panel">
        <div class="move-history-header">Moves</div>
        <div class="move-history-list" id="move-history-list"></div>
      </aside>
    </div>
  </section>

  <section id="win-screen" class="screen hidden overlay">
    <div class="win-card">
      <div class="win-dot" id="win-dot"></div>
      <h2 id="win-title">Player 1 wins!</h2>
      <button id="play-again-btn" class="primary-btn">New Game</button>
    </div>
  </section>

  <script src="js/gameLogic.js?v=47"></script>
  <script src="js/ai/encode.js?v=47"></script>
  <script src="js/ai/network.js?v=47"></script>
  <script src="js/ai/mcts.js?v=47"></script>
  <script src="js/ai/weights.js?v=47"></script>
  <script src="js/ui.js?v=47"></script>

  <!-- TEST-ONLY automation harness, appended for this run - not part of the
       shipped page. Covers the PER-SEAT AI version picker: each AI player's
       row gets its own <select>, populated from the async
       js/ai/versions/index.json fetch, and two different AI seats choosing
       two different checkpoints actually end up running two different
       networks (not just showing two different labels) - run with
       --allow-file-access-from-files, since Chromium blocks fetch() for
       plain file:// pages otherwise (this feature works unrestricted once
       actually served over https, e.g. GitHub Pages). -->
  <script>
    (function () {
      'use strict';
      var errors = [];
      window.onerror = function (msg, src, line, col, err) {
        errors.push(String(msg) + ' @' + line + ':' + col);
        return false;
      };

      function report(obj) {
        document.title = 'RESULT:' + JSON.stringify(obj);
      }

      function fail(reason) {
        report({ ok: false, reason: reason, errors: errors });
      }

      try {
        if (typeof GameLogic === 'undefined') return fail('GameLogic did not load');
        if (typeof MCTS === 'undefined') return fail('MCTS did not load');
        if (typeof AI_WEIGHTS === 'undefined') return fail('AI_WEIGHTS did not load');
        if (typeof AI_VERSION === 'undefined') return fail('AI_VERSION did not load');

        // 3 players: seat 0 stays human, seats 1 and 2 both become AI - the
        // actual point of this test is that they can pick DIFFERENT
        // checkpoints independently, which needs at least 2 AI seats.
        document.querySelectorAll('#player-count-buttons button')[1].click(); // "3"
        var rows = document.querySelectorAll('#player-list .player-row');
        if (rows.length !== 3) return fail('expected 3 player rows after selecting 3p, got ' + rows.length);
        rows[1].querySelector('.ai-toggle-btn').click(); // seat 1 -> AI
        rows[2].querySelector('.ai-toggle-btn').click(); // seat 2 -> AI

        var pollCount = 0;
        function waitForVersionSelects() {
          pollCount++;
          var freshRows = document.querySelectorAll('#player-list .player-row');
          var sel1 = freshRows[1] ? freshRows[1].querySelector('.player-ai-version-select') : null;
          var sel2 = freshRows[2] ? freshRows[2].querySelector('.player-ai-version-select') : null;
          if (sel1 && sel2 && sel1.options.length > 1 && sel2.options.length > 1) {
            afterSelectsPopulated(sel1, sel2);
          } else if (pollCount >= 50) { // 50 * 100ms = 5s
            fail('per-seat version selects never populated (fetch of versions/index.json may have failed) - ' +
              'sel1 options=' + (sel1 ? sel1.options.length : 'n/a') + ' sel2 options=' + (sel2 ? sel2.options.length : 'n/a'));
          } else {
            setTimeout(waitForVersionSelects, 100);
          }
        }

        function afterSelectsPopulated(sel1, sel2) {
          try {
            var optionsCheck = { ok: true };
            var texts1 = Array.from(sel1.options).map(function (o) { return o.textContent; });
            if (sel1.options[0].value !== '' || texts1[0].indexOf('Latest (iteration ' + AI_VERSION.iteration + ')') !== 0) {
              optionsCheck = { ok: false, reason: 'expected first option to be the default "Latest", got "' + texts1[0] + '"' };
            } else if (sel1.value !== '') {
              optionsCheck = { ok: false, reason: 'expected seat 1 to default to "Latest" (value ""), got "' + sel1.value + '"' };
            } else if (sel2.value !== '') {
              optionsCheck = { ok: false, reason: 'expected seat 2 to default to "Latest" (value ""), got "' + sel2.value + '"' };
            }
            if (!optionsCheck.ok) return report({ ok: false, errors: errors, optionsCheck: optionsCheck });

            // Pick two DIFFERENT non-default iterations, one per seat.
            var nonDefaultValues = Array.from(sel1.options).map(function (o) { return o.value; }).filter(function (v) { return v !== ''; });
            if (nonDefaultValues.length < 2) {
              return fail('need at least 2 non-default versions available to test independence, got ' + nonDefaultValues.length);
            }
            var iterForSeat1 = nonDefaultValues[nonDefaultValues.length - 1]; // oldest/weakest
            var iterForSeat2 = nonDefaultValues[0]; // newest available besides the default

            sel1.value = iterForSeat1;
            sel1.dispatchEvent(new Event('change'));
            sel2.value = iterForSeat2;
            sel2.dispatchEvent(new Event('change'));

            // Skip the win%/considered-moves display so consecutive AI turns
            // don't each pay its ~1.4s pause - irrelevant to what this test checks.
            var insightToggle = document.getElementById('ai-insight-toggle-input');
            if (insightToggle && insightToggle.checked) insightToggle.click();

            document.getElementById('start-game-btn').click();

            var startPollCount = 0;
            function waitForGameStart() {
              startPollCount++;
              if (!document.getElementById('game-screen').classList.contains('hidden')) {
                afterGameStarted(optionsCheck, iterForSeat1, iterForSeat2);
              } else if (startPollCount >= 100) { // Start Game waits on any pending per-seat version fetch
                fail('game screen never appeared after Start Game (stuck loading AI versions?) - button text: "' +
                  document.getElementById('start-game-btn').textContent + '"');
              } else {
                setTimeout(waitForGameStart, 100);
              }
            }
            waitForGameStart();
          } catch (e) {
            fail('exception in afterSelectsPopulated: ' + e.message);
          }
        }

        function afterGameStarted(optionsCheck, iterForSeat1, iterForSeat2) {
          try {
            var chips = document.querySelectorAll('.player-chip');
            var chipCheck = { ok: true };
            var seat1Label = chips[1] ? chips[1].querySelector('.player-chip-ai-version') : null;
            var seat2Label = chips[2] ? chips[2].querySelector('.player-chip-ai-version') : null;
            if (!seat1Label || seat1Label.textContent !== 'iter ' + iterForSeat1) {
              chipCheck = { ok: false, reason: 'seat 1 chip should show iter ' + iterForSeat1 + ', got "' + (seat1Label ? seat1Label.textContent : null) + '"' };
            } else if (!seat2Label || seat2Label.textContent !== 'iter ' + iterForSeat2) {
              chipCheck = { ok: false, reason: 'seat 2 chip should show iter ' + iterForSeat2 + ', got "' + (seat2Label ? seat2Label.textContent : null) + '"' };
            }
            if (!chipCheck.ok) return report({ ok: false, errors: errors, optionsCheck: optionsCheck, chipCheck: chipCheck });

            // Prove both distinct-checkpoint seats can actually play, not
            // just display the right label: human opens, then both AI seats
            // (each running a DIFFERENT network) should play automatically,
            // landing back on the human with all 3 opening moves placed.
            document.querySelector('.cell[data-row="3"][data-col="3"]').click();

            var movePollCount = 0;
            var poll = setInterval(function () {
              movePollCount++;
              var stillThinking = !document.getElementById('ai-thinking').classList.contains('hidden');
              var owned = document.querySelectorAll('.cell.owned').length;
              var turnLabel = document.getElementById('turn-label').textContent;
              if (!stillThinking && owned >= 3 && turnLabel.indexOf('Player 1') === 0) {
                clearInterval(poll);
                report({
                  ok: errors.length === 0 && optionsCheck.ok && chipCheck.ok,
                  errors: errors,
                  optionsCheck: optionsCheck,
                  chipCheck: chipCheck,
                  ownedAfterBothAiMoved: owned,
                  turnLabel: turnLabel
                });
              } else if (movePollCount >= 400) { // 400 * 150ms = 60s
                clearInterval(poll);
                fail('timed out waiting for both distinct-checkpoint AI seats to move (owned=' + owned + ', turnLabel="' + turnLabel + '")');
              }
            }, 150);
          } catch (e) {
            fail('exception in afterGameStarted: ' + e.message);
          }
        }

        waitForVersionSelects();
      } catch (e) {
        fail('exception in test driver: ' + e.message);
      }
    })();
  </script>
</body>
</html>
